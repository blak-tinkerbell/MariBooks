<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <title>MariBooks architecture on AWS</title>
  <rect width="1200" height="640" fill="#F2F5F3"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#33483F"/></marker>
    <pattern id="chev" width="32" height="16" patternUnits="userSpaceOnUse"><path d="M0 14 L16 2 L32 14" fill="none" stroke="#E0A43A" stroke-opacity="0.35" stroke-width="2"/></pattern>
  </defs>
  <rect x="0" y="600" width="1200" height="40" fill="url(#chev)"/>
  <text x="40" y="46" font-size="28" font-weight="700" fill="#0C3A35">MariBooks on AWS — serverless, af-south-1 (Cape Town)</text>
  <text x="40" y="72" font-size="15" fill="#52665F">Every data route requires a Cognito JWT; tenant id comes only from the token. Data encrypted at rest with a customer-managed KMS key.</text>

  <!-- client -->
  <rect x="40" y="130" width="230" height="200" rx="18" fill="#0C3A35"/>
  <text x="60" y="165" font-size="18" font-weight="700" fill="#fff">Owner's phone / PC</text>
  <text x="60" y="195" font-size="14" fill="#C3D9D3">React SPA (installable)</text>
  <text x="60" y="218" font-size="14" fill="#C3D9D3">• Offline outbox: saves kept</text>
  <text x="60" y="238" font-size="14" fill="#C3D9D3">  on device, synced later</text>
  <text x="60" y="261" font-size="14" fill="#C3D9D3">• Service worker app shell</text>
  <text x="60" y="284" font-size="14" fill="#C3D9D3">• SMS parser runs locally</text>
  <text x="60" y="304" font-size="14" fill="#C3D9D3">• Receipts upload direct to S3</text>
  <text x="60" y="324" font-size="14" fill="#F2C46D">• Demo mode: no sign-up</text>

  <!-- edge -->
  <rect x="340" y="120" width="250" height="100" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="360" y="152" font-size="17" font-weight="700" fill="#10231F">CloudFront + AWS WAF</text>
  <text x="360" y="176" font-size="13.5" fill="#52665F">HTTPS, HSTS, managed rules,</text>
  <text x="360" y="196" font-size="13.5" fill="#52665F">rate limiting</text>
  <rect x="340" y="250" width="250" height="80" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="360" y="282" font-size="17" font-weight="700" fill="#10231F">S3 (private, OAC)</text>
  <text x="360" y="306" font-size="13.5" fill="#52665F">static app bundle</text>

  <rect x="340" y="370" width="250" height="100" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="360" y="402" font-size="17" font-weight="700" fill="#10231F">Amazon Cognito</text>
  <text x="360" y="426" font-size="13.5" fill="#52665F">owner accounts, SRP sign-in,</text>
  <text x="360" y="446" font-size="13.5" fill="#52665F">optional MFA → JWT</text>

  <!-- api -->
  <rect x="660" y="130" width="250" height="110" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="680" y="162" font-size="17" font-weight="700" fill="#10231F">API Gateway (HTTP)</text>
  <text x="680" y="186" font-size="13.5" fill="#52665F">JWT authorizer, locked CORS,</text>
  <text x="680" y="206" font-size="13.5" fill="#52665F">throttling, access logs</text>
  <rect x="660" y="280" width="250" height="150" rx="14" fill="#0F5E55"/>
  <text x="680" y="312" font-size="17" font-weight="700" fill="#fff">Lambda (Node 22, arm64)</text>
  <text x="680" y="338" font-size="13.5" fill="#DCEFEA">shared domain engine:</text>
  <text x="680" y="358" font-size="13.5" fill="#DCEFEA">decimal-safe money, dual-basis FX,</text>
  <text x="680" y="378" font-size="13.5" fill="#DCEFEA">fees/IMTT, assets, passport,</text>
  <text x="680" y="398" font-size="13.5" fill="#DCEFEA">consent + share locks</text>
  <text x="680" y="416" font-size="13.5" fill="#F2C46D">POST /parse · /proof/* (presign)</text>

  <!-- data -->
  <rect x="970" y="128" width="190" height="78" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="990" y="156" font-size="16" font-weight="700" fill="#10231F">DynamoDB</text>
  <text x="990" y="178" font-size="12.5" fill="#52665F">single table, per-tenant</text>
  <text x="990" y="196" font-size="12.5" fill="#52665F">PK, PITR, SSE-KMS</text>

  <rect x="970" y="214" width="190" height="66" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="990" y="240" font-size="16" font-weight="700" fill="#10231F">S3 proof store</text>
  <text x="990" y="262" font-size="12.5" fill="#52665F">invoices/receipts, private,</text>
  <text x="990" y="278" font-size="12.5" fill="#52665F">presigned, KMS, versioned</text>

  <rect x="970" y="288" width="190" height="60" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="990" y="314" font-size="16" font-weight="700" fill="#10231F">KMS + SSM</text>
  <text x="990" y="336" font-size="12.5" fill="#52665F">CMK, runtime config</text>

  <rect x="970" y="356" width="190" height="54" rx="14" fill="#EEF1EF" stroke="#CBD5D0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="990" y="380" font-size="15.5" font-weight="700" fill="#5A6B64">Amazon Textract</text>
  <text x="990" y="400" font-size="12.5" fill="#7A8C84">Phase 2 — not in af-south-1</text>

  <rect x="970" y="418" width="190" height="54" rx="14" fill="#FBEFD6" stroke="#F0D9A8" stroke-width="2"/>
  <text x="990" y="442" font-size="15.5" font-weight="700" fill="#10231F">Amazon Bedrock</text>
  <text x="990" y="462" font-size="12.5" fill="#7A4E00">optional: refines unclear SMS</text>

  <rect x="660" y="470" width="500" height="80" rx="14" fill="#fff" stroke="#DCE5E1" stroke-width="2"/>
  <text x="680" y="502" font-size="17" font-weight="700" fill="#10231F">CloudTrail · CloudWatch alarms → SNS · X-Ray</text>
  <text x="680" y="526" font-size="13.5" fill="#52665F">audit trail with log-file validation; Lambda errors and API 5xx alarms</text>

  <g stroke="#33483F" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M270 175 H336"/>
    <path d="M465 220 V246"/>
    <path d="M270 300 Q300 420 336 420"/>
    <path d="M155 130 V110 H785 V126"/>
    <path d="M785 240 V276"/>
    <path d="M910 320 Q940 200 966 167"/>
    <path d="M910 350 Q940 250 966 247"/>
    <path d="M910 360 Q940 320 966 318"/>
    <path d="M910 410 Q940 440 966 445"/>
    <path d="M590 420 Q630 250 656 215"/>
  </g>
  <!-- browser uploads proof straight to S3 via a presigned URL (bypasses Lambda) -->
  <g stroke="#B8862B" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 4">
    <path d="M270 250 Q620 250 620 250 T1065 214"/>
  </g>
  <!-- Phase 2: Lambda → Textract (held back; not in af-south-1) -->
  <g stroke="#AEB9B4" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4">
    <path d="M910 390 Q940 383 966 383"/>
  </g>
  <text x="600" y="104" font-size="12.5" fill="#52665F">API calls: HTTPS + JWT</text>
  <text x="690" y="243" font-size="12.5" fill="#B8862B">receipt upload → S3 (presigned, direct)</text>
  <text x="480" y="352" font-size="12.5" fill="#52665F">issuer / JWKS</text>
</svg>
