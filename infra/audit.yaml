AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MariBooks — audit & observability stack (standalone). Provisions a multi-region CloudTrail
  writing to an encrypted, versioned, delete-protected S3 bucket, plus an SNS alarm topic and
  CloudWatch alarms for the API Lambda errors and HTTP API 5xx responses. Cross-stack resource
  names are passed as parameters and gated by Conditions so this template validates and deploys
  independently of the core maribooks-prod stack. Region: af-south-1.

Parameters:
  AppName:
    Type: String
    Default: maribooks
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address for SNS alarm notifications. If non-empty, an email subscription is
      created (you must confirm it via the email AWS sends). Leave empty to just create the topic.
  ApiFunctionName:
    Type: String
    Default: ""
    Description: >
      Name of the ApiFunction Lambda from the core stack (maribooks-prod). When provided, a
      Lambda Errors alarm is created. Leave empty to skip the alarm.
  HttpApiId:
    Type: String
    Default: ""
    Description: >
      The API ID of the HTTP API from the core stack (maribooks-prod). When provided, an API
      Gateway 5xx alarm is created. Leave empty to skip the alarm.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasApiFunctionName: !Not [!Equals [!Ref ApiFunctionName, ""]]
  HasHttpApiId: !Not [!Equals [!Ref HttpApiId, ""]]

Resources:
  # ---------- CloudTrail log destination: encrypted, versioned, delete-protected ----------
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-${Stage}-cloudtrail-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "${AppName}-${Stage}-trail"
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true

  # ---------- Alarm notifications ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AppName}-${Stage}-alarms"
      DisplayName: !Sub "${AppName} ${Stage} alarms"
      Subscription:
        !If
          - HasAlarmEmail
          - - Protocol: email
              Endpoint: !Ref AlarmEmail
          - !Ref AWS::NoValue

  # ---------- CloudWatch alarms ----------
  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasApiFunctionName
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-api-lambda-errors"
      AlarmDescription: !Sub "ApiFunction (${ApiFunctionName}) reported one or more errors."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasHttpApiId
    Properties:
      AlarmName: !Sub "${AppName}-${Stage}-api-5xx"
      AlarmDescription: !Sub "HTTP API (${HttpApiId}) returned 5xx responses."
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

Outputs:
  TrailBucketName:
    Description: Name of the S3 bucket receiving CloudTrail logs
    Value: !Ref TrailBucket
  AlarmTopicArn:
    Description: ARN of the SNS topic for CloudWatch alarm notifications
    Value: !Ref AlarmTopic
