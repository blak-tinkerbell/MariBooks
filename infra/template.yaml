AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  MariBooks — secure serverless web app (API Gateway HTTP API + Lambda + DynamoDB) with a
  Cognito-authenticated API and KMS encryption. Hosting (S3 + CloudFront + WAF) is described
  in the design; this template provisions the data/API/auth core first so the app can ship.

Parameters:
  AppName:
    Type: String
    Default: maribooks
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  CorsOrigin:
    Type: String
    Default: "https://d3vn6ch6zctfj4.cloudfront.net"
    Description: >
      The exact CloudFront origin allowed to call the API (no wildcard). This is also written to
      SSM Parameter Store so runtime config lives outside code. Update this if the CloudFront
      domain changes.

  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      Optional Amazon Bedrock model or inference-profile id used to refine pasted payment SMS
      that the rule-based parser could not fully read. Empty disables the AI step (the rules
      parser still works).
  BedrockRegion:
    Type: String
    Default: ""
    Description: Region to call Bedrock in (empty = the stack region).
  TextractRegion:
    Type: String
    Default: ""
    Description: >
      Region to call Amazon Textract (AnalyzeExpense) in. Textract is NOT available in every
      region (notably not af-south-1), and AnalyzeExpense with an S3 object requires the bucket
      and the Textract call to be in the SAME region. If this stack's region does not support
      Textract, deploy the proof bucket in a Textract region (its own small stack) and set this
      to that region. Empty = the stack region. Receipt scanning degrades gracefully if the
      region does not support it (the file still attaches; the owner fills the form by hand).

Conditions:
  HasBedrock: !Not [!Equals [!Ref BedrockModelId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Architectures: [arm64]

Resources:
  # ---------- KMS (M6): customer-managed key for data at rest ----------
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${AppName}-${Stage} data key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRoot
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AppName}-${Stage}-data"
      TargetKeyId: !Ref DataKey

  # ---------- SSM Parameter Store (M6): runtime config, no secrets in code ----------
  # Non-secret runtime config (the allowed CORS origin) lives in SSM rather than being baked
  # into the function. A SecureString would be used the same way for any actual secret; there
  # are currently no secrets to store (auth is delegated to Cognito; the SPA client has none).
  ConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AppName}/${Stage}/cors-origin"
      Type: String
      Value: !Ref CorsOrigin
      Description: Allowed CloudFront origin for the API (runtime config, not a secret).

  # ---------- DynamoDB (M4): single-table, SSE-KMS, PITR, deletion protection ----------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-${Stage}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ---------- S3 proof store: uploaded invoices/receipts (private, KMS, CORS to app) ----------
  # Files are uploaded by the browser via short-lived presigned URLs and never pass through
  # Lambda. Private (no public access), SSE-KMS with the same CMK as the table, versioned, and
  # CORS locked to the app origin so only the SPA can PUT/GET.
  ProofBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-${Stage}-proof-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DataKey
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 365
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref CorsOrigin]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # ---------- Cognito (M5): owner accounts + JWT ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-${Stage}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: "OPTIONAL"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AppName}-${Stage}-spa"
      GenerateSecret: false # public SPA client; SRP auth (no client secret in the browser)
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  # ---------- Lambda (M3): sync API, least-privilege ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pre-bundled by `npm run bundle --workspace api` (esbuild) into api/dist.
      CodeUri: ../api/dist/
      Handler: handler.handler
      # dist/handler.mjs is ESM; Lambda infers ESM from the .mjs extension.
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          CONFIG_PARAM_NAME: !Ref ConfigParameter
          PROOF_BUCKET: !Ref ProofBucket
          TEXTRACT_REGION: !Ref TextractRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref BedrockRegion
          NODE_OPTIONS: "--enable-source-maps"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: TableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt Table.Arn
            - Sid: KeyUse
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt DataKey.Arn
            - Sid: ConfigRead
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/${Stage}/cors-origin"
            - Sid: ProofStoreAccess
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${ProofBucket.Arn}/*"
            - Sid: ReceiptTextract
              Effect: Allow
              Action:
                - textract:AnalyzeExpense
              Resource: "*"
            - !If
              - HasBedrock
              - Sid: BedrockParseSms
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - !Ref AWS::NoValue
      Events:
        ListTx:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transactions
            Method: GET
        PutTx:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transactions/{id}
            Method: PUT
        DelTx:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transactions/{id}
            Method: DELETE
        ParseSms:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /parse
            Method: POST
        ProofUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /proof/upload-url
            Method: POST
        ProofScan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /proof/scan
            Method: POST
        ProofView:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /proof/view
            Method: GET
        GetRates:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rates
            Method: GET
        PutRate:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rates/{date}
            Method: PUT
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profile
            Method: GET
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profile
            Method: PUT
        ListShares:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /shares
            Method: GET
        PutShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /shares/{id}
            Method: PUT
        DeleteShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /shares/{id}
            Method: DELETE

  # ---------- API Gateway HTTP API (M2): JWT authorizer, CORS, throttling, access logs ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowMethods: [GET, PUT, POST, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        # Locked to the exact CloudFront origin (no wildcard). Sourced from the CorsOrigin
        # parameter, which is also published to SSM Parameter Store (see ConfigParameter).
        AllowOrigins:
          - !Ref CorsOrigin
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","route":"$context.routeKey","status":"$context.status","latency":"$context.responseLatency","principal":"$context.authorizer.claims.sub"}

  # ---------- Observability (M7) ----------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AppName}/${Stage}/http-api-access"
      RetentionInDays: 90

Outputs:
  ApiEndpoint:
    Description: Base URL of the sync API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  ProofBucketName:
    Description: S3 bucket holding uploaded invoices/receipts (private)
    Value: !Ref ProofBucket
  Region:
    Value: !Ref AWS::Region
